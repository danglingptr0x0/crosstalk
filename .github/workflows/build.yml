name: build
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      steam:
        description: build the latest Crosstalk release and force its Steam upload, live set and post
        type: boolean
        default: false
permissions:
  contents: read
env:
  LDG_REPO: danglingptr0x0/libdangling
  LRS_REPO: danglingptr0x0/libresteam
  TC_REPO: danglingptr0x0/llvm-project-dangcsa_dangxa
  WIN_PREFIX: /opt/x86_64-w64-mingw32
  MINGW_ROOT: /usr/x86_64-w64-mingw32
  LRS_LINUX: /opt/libresteam-linux
  LRS_WIN: /opt/x86_64-w64-mingw32
  DISCORD_TAG: discordsdk
  DISCORD_ZIP: DiscordSocialSdk-1.10.18247.zip
  DISCORD_DIR: DiscordSocialSdk-1.10.18247
  DISCORD_SHA512: f5269886f10855f445ce0bfc9a315013725955a1210684d33fe244823b482479a17766518280453accbd873e2097f836ddb7d742ee2245162f1729513d1a0dc3
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ck.outputs.run }}
    steps:
      - name: release tag on this commit
        id: ck
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            if git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" | grep -E "^${GITHUB_SHA}[[:space:]]+refs/tags/[0-9]"; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    outputs:
      rel: ${{ steps.stage.outputs.rel }}
    permissions:
      contents: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: packages
        run: pacman -Syu --noconfirm --needed cmake ninja nasm pkgconf curl jq git github-cli mingw-w64-gcc pipewire unzip libarchive git-cliff alsa-lib libpulse libx11
      - name: latest release
        if: inputs.steam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.draft == false) | select(.tag_name | test("^[0-9]"))][0].tag_name')"
          test -n "$tag" && test "$tag" != "null"
          echo "RELTAG=$tag" >> "$GITHUB_ENV"
      - name: checkout crosstalk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELTAG || github.ref }}
          path: crosstalk
          fetch-depth: 0
          persist-credentials: false
      - name: git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/crosstalk"
      - name: discord sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DISCORD_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DISCORD_ZIP" --dir "$RUNNER_TEMP"
          sdk_actual="$(sha512sum "$RUNNER_TEMP/$DISCORD_ZIP")"
          test "${sdk_actual%% *}" = "$DISCORD_SHA512"
          mkdir -p "crosstalk/$DISCORD_DIR"
          unzip -q "$RUNNER_TEMP/$DISCORD_ZIP" -d "crosstalk/$DISCORD_DIR"
          if [ ! -d "crosstalk/$DISCORD_DIR/discord_social_sdk" ]; then mv "crosstalk/$DISCORD_DIR"/*/discord_social_sdk "crosstalk/$DISCORD_DIR/"; fi
          test -d "crosstalk/$DISCORD_DIR/discord_social_sdk/include"
      - name: toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$TC_REPO/releases/latest" | jq -r '[.assets[] | select(.name | test("linux"; "i"))][0].browser_download_url')"
          test -n "$url" && test "$url" != "null"
          mkdir -p "$RUNNER_TEMP/tc"
          curl -fsSL -o "$RUNNER_TEMP/tc.archive" "$url"
          gh attestation verify "$RUNNER_TEMP/tc.archive" --repo "$TC_REPO"
          tar -xf "$RUNNER_TEMP/tc.archive" -C "$RUNNER_TEMP/tc"
          cc="$(find "$RUNNER_TEMP/tc" -type f -path '*/bin/clang' | head -n 1)"
          test -x "$cc"
          echo "CC=$cc" >> "$GITHUB_ENV"
          echo "CC_DIR=$(dirname "$cc")" >> "$GITHUB_ENV"
          "$cc" --version
      - name: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() { url="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" | jq -r --arg sfx "$2" '[.assets[] | select(.name | endswith($sfx))][0].browser_download_url')"; test -n "$url" && test "$url" != "null"; curl -fsSL -o "$RUNNER_TEMP/$3" "$url"; gh attestation verify "$RUNNER_TEMP/$3" --repo "$1"; mkdir -p "$4"; tar -xJf "$RUNNER_TEMP/$3" -C "$4"; }
          fetch "$LDG_REPO" -linux-amd64.tar.xz ldg-linux.tar.xz /usr/local
          fetch "$LDG_REPO" -windows-amd64.tar.xz ldg-windows.tar.xz "$WIN_PREFIX"
          fetch "$LRS_REPO" -linux-amd64.tar.xz lrs-linux.tar.xz "$LRS_LINUX"
          fetch "$LRS_REPO" -windows-amd64.tar.xz lrs-windows.tar.xz "$LRS_WIN"
          ldconfig
      - name: codeql init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: c-cpp
          build-mode: manual
      - name: crosstalk linux
        run: |
          cmake -S crosstalk -B crosstalk/build -G Ninja -DCMAKE_C_COMPILER="$CC" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCROSSTALK_LIBRESTEAM_PREFIX="$LRS_LINUX"
          cmake --build crosstalk/build
      - name: crosstalk windows
        env:
          PKG_CONFIG_LIBDIR: ${{ env.WIN_PREFIX }}/lib/pkgconfig
          PKG_CONFIG_PATH: ${{ env.WIN_PREFIX }}/lib/pkgconfig
        run: |
          cmake -S crosstalk -B crosstalk/build-win -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_C_COMPILER="$CC" -DCMAKE_C_COMPILER_TARGET=x86_64-w64-mingw32 -DCMAKE_FIND_ROOT_PATH="$WIN_PREFIX;$MINGW_ROOT" -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_PREFIX_PATH="$WIN_PREFIX" -DCMAKE_C_STANDARD_LIBRARIES="-lbcrypt -lxmllite -luuid" -DCROSSTALK_LIBRESTEAM_PREFIX="$LRS_WIN"
          cmake --build crosstalk/build-win
      - name: dangem linux
        run: |
          cmake -S crosstalk/tools/dangem -B crosstalk/tools/dangem/build -G Ninja -DCMAKE_C_COMPILER="$CC"
          cmake --build crosstalk/tools/dangem/build
      - name: dangem windows
        env:
          PKG_CONFIG_LIBDIR: ${{ env.WIN_PREFIX }}/lib/pkgconfig
          PKG_CONFIG_PATH: ${{ env.WIN_PREFIX }}/lib/pkgconfig
        run: |
          cmake -S crosstalk/tools/dangem -B crosstalk/tools/dangem/build-win -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_C_COMPILER="$CC" -DCMAKE_C_COMPILER_TARGET=x86_64-w64-mingw32 -DCMAKE_FIND_ROOT_PATH="$WIN_PREFIX;$MINGW_ROOT" -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_PREFIX_PATH="$WIN_PREFIX"
          cmake --build crosstalk/tools/dangem/build-win
      - name: codeql analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          checkout_path: ${{ github.workspace }}/crosstalk
      - name: sonarqube
        if: github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        with:
          projectBaseDir: crosstalk
          args: >
            -Dsonar.organization=danglingptr0x0 -Dsonar.projectKey=danglingptr0x0_crosstalk -Dsonar.sources=src -Dsonar.cfamily.compile-commands=crosstalk/build/compile_commands.json

      - name: stage
        id: stage
        run: |
          rel="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then rel="${GITHUB_SHA::12}"; fi
          if [ -n "${RELTAG:-}" ]; then rel="$RELTAG"; fi
          echo "REL=$rel" >> "$GITHUB_ENV"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"
          sdk="crosstalk/$DISCORD_DIR/discord_social_sdk"
          lin="out/crosstalk-$rel-linux-amd64"
          win="out/crosstalk-$rel-windows"
          mkdir -p "$lin" "$win"
          cp -L crosstalk/build/crosstalk crosstalk/build/libresteam.so.0 /usr/local/lib/libdangling.so* "$sdk/lib/release/libdiscord_partner_sdk.so" "$sdk"/lib/release/*.kef crosstalk/LICENSE "$lin/"
          cp -L crosstalk/build-win/crosstalk.exe crosstalk/build-win/libresteam.dll crosstalk/build-win/libdangling.dll "$sdk/bin/release/discord_partner_sdk.dll" "$sdk/bin/release/discord_krisp.dll" "$sdk"/bin/release/*.kef crosstalk/LICENSE "$win/"
          cp -r crosstalk/res "$lin/res"
          cp -r crosstalk/res "$win/res"
          tar -cJf "crosstalk-$rel-linux-amd64.tar.xz" -C out "crosstalk-$rel-linux-amd64"
          bsdtar --format zip -cf "crosstalk-$rel-windows.zip" -C out "crosstalk-$rel-windows"
          tar -tvJf "crosstalk-$rel-linux-amd64.tar.xz"
          bsdtar -tvf "crosstalk-$rel-windows.zip"
          sha512sum "crosstalk-$rel-linux-amd64.tar.xz" "crosstalk-$rel-windows.zip" "$lin/crosstalk" "$win/crosstalk.exe"
      - name: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            crosstalk-${{ env.REL }}-linux-amd64.tar.xz
            crosstalk-${{ env.REL }}-windows.zip
            out/crosstalk-${{ env.REL }}-linux-amd64/crosstalk
            out/crosstalk-${{ env.REL }}-windows/crosstalk.exe
      - name: upload linux
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: crosstalk-${{ env.REL }}-linux-amd64.tar.xz
          archive: false
          if-no-files-found: error
      - name: upload windows
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: crosstalk-${{ env.REL }}-windows.zip
          archive: false
          if-no-files-found: error
      - name: changelog
        if: github.ref_type == 'tag'
        run: |
          git-cliff --config crosstalk/.github/cliff.toml --repository crosstalk --latest --output changelog.md
          cat changelog.md
      - name: steam stage
        if: github.ref_type == 'tag' || inputs.steam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk="crosstalk/$DISCORD_DIR/discord_social_sdk"
          c=steam/content
          mkdir -p "$c/win" "$c/linux" "$c/bloat_win" "$c/bloat_linux" "$RUNNER_TEMP/tcw" "$RUNNER_TEMP/wincc"
          gh release download --repo "$TC_REPO" --pattern '*-windows-amd64.tar.xz' --dir "$RUNNER_TEMP/tcw"
          for archive in "$RUNNER_TEMP"/tcw/*-windows-amd64.tar.xz; do gh attestation verify "$archive" --repo "$TC_REPO"; tar -xJf "$archive" -C "$RUNNER_TEMP/tcw"; done
          gccdir="$(find /usr/lib/gcc/x86_64-w64-mingw32 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp -r "$RUNNER_TEMP/tcw/windows/." "$RUNNER_TEMP/wincc/"
          mkdir -p "$RUNNER_TEMP/wincc/x86_64-w64-mingw32" "$RUNNER_TEMP/wincc/lib/gcc/x86_64-w64-mingw32/$(basename "$gccdir")"
          cp -rL "$MINGW_ROOT/include" "$MINGW_ROOT/lib" "$RUNNER_TEMP/wincc/x86_64-w64-mingw32/"
          cp -L "$gccdir/crtbegin.o" "$gccdir/crtend.o" "$gccdir/crtfastmath.o" "$gccdir/libgcc.a" "$gccdir/libgcc_eh.a" "$RUNNER_TEMP/wincc/lib/gcc/x86_64-w64-mingw32/$(basename "$gccdir")/"
          cp -r "out/crosstalk-$REL-windows/." "$c/bloat_win/"
          cp -r "out/crosstalk-$REL-linux-amd64/." "$c/bloat_linux/"
          cp -L crosstalk/tools/dangem/build-win/dangem.exe crosstalk/build-win/libresteam.dll crosstalk/build-win/libdangling.dll "$sdk/bin/release/discord_partner_sdk.dll" "$sdk/bin/release/discord_krisp.dll" "$sdk"/bin/release/*.kef crosstalk/LICENSE crosstalk/CONTRIBUTING "$c/win/"
          cp -L crosstalk/tools/dangem/build/dangem crosstalk/build/libresteam.so.0 "$sdk/lib/release/libdiscord_partner_sdk.so" "$sdk"/lib/release/*.kef crosstalk/LICENSE crosstalk/CONTRIBUTING "$c/linux/"
          mkdir -p "$c/linux/ldg/lib"
          cp -L /usr/local/lib/libdangling.so* "$c/linux/ldg/lib/"
          for t in win linux; do cp -r crosstalk/res "$c/$t/res"; cp -r crosstalk/src "$c/$t/src"; mkdir -p "$c/$t/$DISCORD_DIR/discord_social_sdk"; cp -r "$sdk/include" "$c/$t/$DISCORD_DIR/discord_social_sdk/include"; done
          mkdir -p "$c/win/build-win/dangem" "$c/linux/build/dangem"
          cp crosstalk/build-win/dangem/build-windows.lst crosstalk/build-win/dangem/RELEASE "$c/win/build-win/dangem/"
          cp crosstalk/build/dangem/build-linux.lst crosstalk/build/dangem/RELEASE "$c/linux/build/dangem/"
          for t in win bloat_win; do mkdir -p "$c/$t/res/utils/cc"; cp -r "$RUNNER_TEMP/wincc/." "$c/$t/res/utils/cc/"; done
          for t in linux bloat_linux; do mkdir -p "$c/$t/res/utils/cc"; cp -r "$(dirname "$CC_DIR")/." "$c/$t/res/utils/cc/"; done
          script="$(cat crosstalk/.github/steam/installscript_win.vdf)"
          printf '%s\n' "$script" | tee "$c/win/installscript_win.vdf"
          printf '%s\n' "${script//4898790/5466650}" | tee "$c/bloat_win/installscript_win.vdf"
          git-cliff --config crosstalk/.github/steam/cliff_bbcode.toml --repository crosstalk --latest --output steam/changelog.bbcode
          cat steam/changelog.bbcode
          tar -cf steam.tar steam
          du -sh steam.tar
      - name: release windows build
        if: github.ref_type == 'tag'
        run: |
          sdk="crosstalk/$DISCORD_DIR/discord_social_sdk"
          w="out/crosstalk-$REL-build-windows-amd64"
          mkdir -p "$w/build-win/dangem" "$w/ldg" "$w/res/utils/cc" "$w/$DISCORD_DIR/discord_social_sdk/lib/release"
          cp crosstalk/build-win/dangem/build-windows.lst crosstalk/build-win/dangem/RELEASE "$w/build-win/dangem/"
          if [ -d crosstalk/build-win/gen ]; then cp -r crosstalk/build-win/gen "$w/build-win/gen"; fi
          cp -rL "$WIN_PREFIX/include" "$w/ldg/include"
          cp -rL "$WIN_PREFIX/lib" "$w/ldg/lib"
          cp -r "$sdk/include" "$w/$DISCORD_DIR/discord_social_sdk/include"
          cp "$sdk/lib/release/discord_partner_sdk.lib" "$w/$DISCORD_DIR/discord_social_sdk/lib/release/"
          cp -L crosstalk/build-win/libresteam.dll crosstalk/build-win/libdangling.dll "$sdk/bin/release/discord_partner_sdk.dll" "$sdk/bin/release/discord_krisp.dll" "$sdk"/bin/release/*.kef crosstalk/LICENSE crosstalk/CONTRIBUTING "$w/"
          cp -r crosstalk/res/. "$w/res/"
          cp -r "$RUNNER_TEMP/wincc/." "$w/res/utils/cc/"
          bsdtar --format zip -cf "crosstalk-$REL-build-windows-amd64.zip" -C "$w" .
          du -sh "crosstalk-$REL-build-windows-amd64.zip"
      - name: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=--latest
          case "$REL" in *-rc*) kind=--prerelease ;; esac
          gh release create "$REL" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$REL" --notes-file changelog.md "$kind" "crosstalk-$REL-linux-amd64.tar.xz" "crosstalk-$REL-windows.zip" "crosstalk-$REL-build-windows-amd64.zip"
      - name: steam upload artifact
        if: github.ref_type == 'tag' || inputs.steam
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: steam
          path: steam.tar
          if-no-files-found: error
  steam:
    needs: build
    if: github.ref_type == 'tag' || inputs.steam
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y lib32gcc-s1 qrencode
      - name: checkout crosstalk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: crosstalk
          persist-credentials: false
      - name: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name steam --dir "$RUNNER_TEMP/dl"
          tar -xf "$RUNNER_TEMP/dl/steam.tar" -C "$RUNNER_TEMP"
      - name: deploy
        env:
          REL: ${{ needs.build.outputs.rel }}
          STEAM_USER: ${{ secrets.STEAMWORKS_USER }}
          STEAM_PASS: ${{ secrets.STEAMWORKS_PASS }}
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAMWORKS_PUBLISHER_KEY }}
        run: CONTENT="$RUNNER_TEMP/steam/content" WORK="$RUNNER_TEMP/work" CHANGELOG="$RUNNER_TEMP/steam/changelog.bbcode" bash crosstalk/.github/steam/deploy.sh
